{{ $count := .Get "count" | default 3 }}
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; margin-bottom: 2rem;">
  {{ range first $count (where .Site.RegularPages "Section" "records") }}

  <a href="{{ .RelPermalink }}" style="text-decoration: none; color: inherit; display: block;">
    <div class="natural-card" style="border-radius: 16px; overflow: hidden; height: 100%; box-sizing: border-box;">

      {{ $image := .Params.featureimage | default "/images/party.webp" }}
      <img src="{{ $image }}" alt="{{ .Title }}" style="width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid var(--color-bark-light);">

      <div style="padding: 1.5rem;">
        <div style="color: var(--color-leaf); font-size: 0.85rem; font-weight: bold; margin-bottom: 0.5rem;">
          📅 {{ .Date.Format "2006 年 01 月 02 日" }}
        </div>
        <h3 style="font-size: 1.25rem; margin-top: 0; margin-bottom: 0.8rem; font-weight: bold; line-height: 1.4; color: var(--color-soil);">{{ .Title }}</h3>
        <p style="font-size: 0.95rem; line-height: 1.6; opacity: 0.85; margin-bottom: 0; color: var(--color-soil);">
          {{ .Summary | truncate 80 }}
        </p>
      </div>
    </div>
  </a>
  {{ end }}
</div>

<div style="text-align: center; margin-bottom: 3rem;">
 <a href="/records/" style="display: inline-block; border: 1px solid var(--color-bark-light); color: var(--color-soil); padding: 10px 28px; border-radius: 99px; text-decoration: none; font-size: 1rem; transition: all 0.3s;" onmouseover="this.style.backgroundColor='rgba(138,99,57,0.08)';" onmouseout="this.style.backgroundColor='transparent';">
  查看更多活動成果 ➔
 </a>
</div>

backend:
  name: github
  repo: lumifarm/lumifarm.org
  branch: main
  base_url: https://www.lumifarm.org
  auth_endpoint: api/auth
  # 告訴 CMS 您的前台網址在哪裡
  site_url: "https://www.lumifarm.org"

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "📚 知識庫文章"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "posts/{{slug}}"
    fields:
      - {label: "標題", name: "title", widget: "string"}
      - {label: "日期", name: "date", widget: "datetime"}
      - {label: "簡介", name: "description", widget: "text", required: false}
      - {label: "內文", name: "body", widget: "markdown"}

  - name: "events"
    label: "📅 農場活動 (月曆)"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "events/{{slug}}"
    fields:
      - {label: "活動名稱", name: "title", widget: "string"}
      - {label: "活動日期", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ"}
      - {label: "報名連結", name: "link", widget: "string", required: false}
      - {label: "活動詳情", name: "body", widget: "markdown", required: false}